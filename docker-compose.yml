services:
  # ==========================================
  # 1. INFRASTRUCTURE (DATABASES AND QUEUE)
  # ==========================================

  # Primary relational database
  postgres_db:
    image: postgres:18-alpine
    container_name: pizza_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '5432:5432' # Host access for local development only
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - pizza_network

  # Database for error and info logs
  mongodb:
    image: mongo:8.0
    container_name: pizza_mongo
    restart: always
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - '27017:27017' # Host access for local development only
    volumes:
      - mongo_data:/data/db
    networks:
      - pizza_network

  # Message broker between microservices
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    container_name: pizza_rabbitmq
    hostname: pizza-rabbit
    restart: always
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      # AMQP (5672) stays inside pizza_network; only the management UI is published
      - '15672:15672' # RabbitMQ panel
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - pizza_network

  # Локальный почтовый сервер для тестирования отправки писем
  mailpit:
    image: axllent/mailpit
    container_name: pizza_mailpit
    restart: always
    ports:
      - '1025:1025' # Порт SMTP (туда наш код будет отправлять письма)
      - '8025:8025' # Веб-панель (туда мы будем заходить через браузер, чтобы читать письма)
    networks:
      - pizza_network

  # Веб-интерфейс Mongo Express
  mongo-express:
    image: mongo-express:latest
    container_name: pizza_mongo_express
    restart: always
    env_file:
      - .env
    environment:
      # Настройки авторизации для входа в саму веб-панель в браузере
      ME_CONFIG_OPTIONS_EDITORTHEME: 'ambiance'
      ME_CONFIG_BASICAUTH_USERNAME: 'admin'
      ME_CONFIG_BASICAUTH_PASSWORD: 'logpass'

      # Cтрока подключения
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
      # Явно фиксируем внутренний порт для скрипта инициализации
      VCAP_APP_PORT: 3000
      ME_CONFIG_OPTIONS_DOCUMENTSPERPAGE: 1000
    ports:
      - '8081:3000'
    depends_on:
      - mongodb
    networks:
      - pizza_network

  # ==========================================
  # 2. APPLICATION MICROSERVICES
  # ==========================================

  # Single HTTP entry point (API Gateway)
  api-gateway:
    build:
      context: .
      dockerfile: src/apps/api-gateway/Dockerfile #! изменение пути
      target: builder # останавливаем сборку на этапе builder, где есть Nest CLI
      args:
        BUILD_DIST: 'false' # Говорим Dockerfile: "Не собирай dist на диске F"
    container_name: pizza_api_gateway
    restart: always
    env_file:
      - .env
    ports:
      - '3000:3000' # The only public application port
    environment:
      NODE_ENV: development
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      WATCHPACK_POLLING: 'true' # Альтернативный триггер для Webpack/Rspack систем для hot-reload
    volumes:
      - .:/usr/src/app # 1. Пробрасываем ВЕСЬ корень
      - /usr/src/app/node_modules # 2. Изолируем корневые node_modules
    command: npm run start:dev -- api-gateway
    depends_on:
      - rabbitmq
    networks:
      - pizza_network

  # Auth and user management (internal; talks via RabbitMQ)
  auth-service:
    build:
      context: .
      dockerfile: src/apps/auth-service/Dockerfile
      target: builder
      args:
        BUILD_DIST: 'false'
    container_name: pizza_auth_service
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      # MONGO_URI_AUTH: ${MONGO_URI_AUTH}
      WATCHPACK_POLLING: 'true'
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run start:dev -- auth-service
    depends_on:
      - postgres_db
      # - mongodb
      - rabbitmq
    networks:
      - pizza_network

  # Ingredients microservice (internal; talks via RabbitMQ)
  ingredients-service:
    build:
      context: .
      dockerfile: src/apps/ingredients-service/Dockerfile
      target: builder
      args:
        BUILD_DIST: 'false'
    container_name: pizza_ingredients_service
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      WATCHPACK_POLLING: 'true'
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run start:dev -- ingredients-service
    depends_on:
      - postgres_db
      - rabbitmq
    networks:
      - pizza_network

  # Pizza microservice (internal; talks via RabbitMQ)
  pizza-service:
    build:
      context: .
      dockerfile: src/apps/pizza-service/Dockerfile
      target: builder
      args:
        BUILD_DIST: 'false'
    container_name: pizza_pizza_service
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      WATCHPACK_POLLING: 'true'
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - ./uploads:/usr/src/app/uploads #! проверить пути
    command: npm run start:dev -- pizza-service
    depends_on:
      - postgres_db
      - rabbitmq
    networks:
      - pizza_network

  # Promo codes microservice (internal; talks via RabbitMQ)
  promo-code-service:
    build:
      context: .
      dockerfile: src/apps/promo-code-service/Dockerfile
      target: builder
      args:
        BUILD_DIST: 'false'
    container_name: pizza_promo_code_service
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      WATCHPACK_POLLING: 'true'
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run start:dev -- promo-code-service
    depends_on:
      - postgres_db
      - rabbitmq
    networks:
      - pizza_network

  # Cart microservice (internal; talks via RabbitMQ)
  cart-service:
    build:
      context: .
      dockerfile: src/apps/cart-service/Dockerfile
      target: builder
      args:
        BUILD_DIST: 'false'
    container_name: pizza_cart_service
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      WATCHPACK_POLLING: 'true'
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run start:dev -- cart-service
    depends_on:
      - postgres_db
      - rabbitmq
    networks:
      - pizza_network

  # Order microservice (internal; talks via RabbitMQ)
  order-service:
    build:
      context: .
      dockerfile: src/apps/order-service/Dockerfile
      target: builder
      args:
        BUILD_DIST: 'false'
    container_name: pizza_order_service
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      WATCHPACK_POLLING: 'true'
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run start:dev -- order-service
    depends_on:
      - postgres_db
      - rabbitmq
    networks:
      - pizza_network

  # Email notifications (internal; talks via RabbitMQ)
  notification-service:
    build:
      context: .
      dockerfile: src/apps/notification-service/Dockerfile
      target: builder
      args:
        BUILD_DIST: 'false'
    container_name: pizza_notification_service
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: development
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      WATCHPACK_POLLING: 'true'
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run start:dev -- notification-service
    depends_on:
      - rabbitmq
    networks:
      - pizza_network

  # Logging into MongoDB (internal; talks via RabbitMQ)
  logger-service:
    build:
      context: .
      dockerfile: src/apps/logger-service/Dockerfile
      target: builder
      args:
        BUILD_DIST: 'false'
    container_name: pizza_logger_service
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      WATCHPACK_POLLING: 'true'
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run start:dev -- logger-service
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - pizza_network

# Named volumes (so data survives when container restarts)
volumes:
  postgres_data:
  mongo_data:
  rabbitmq_data:

# Isolated Docker network: services talk to each other by name, not via the host
networks:
  pizza_network:
    driver: bridge
